<style>
  html,body{margin:0;height:100%;background:#070a06;color:#f4f6ee;font-family:"Figtree","Avenir Next",system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  img{height:20px;width:auto}
  .spin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(225,250,0,.25);border-top-color:#e1fa00;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  p{margin:0;font-size:18px}
  a{color:#141900;background:#e1fa00;font-weight:800;text-decoration:none;padding:16px 26px;border-radius:999px;font-size:16px}

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KK55LSQ3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<main>
  <img src="/grupovip/img/logo-botoclinic.png" alt="Botoclinic">
  <div class="spin" aria-hidden="true"></div>
  <p>Abrindo o Grupo VIP no WhatsApp...</p>
  <a id="ir" href="https://chat.whatsapp.com/DHB9mAQ8wiy9R8bUScbYYr?s=cl&amp;p=i&amp;iam=2">Toque aqui se não abrir</a>
  <small>Botoclinic Pelotas</small>
</main>
<script>
(function(){
  // Lead disparado com a pagina aberta: o envio nao se perde quando o WhatsApp abre.
  var GRUPO = 'https://chat.whatsapp.com/DHB9mAQ8wiy9R8bUScbYYr?s=cl&p=i&iam=2';
  var local = (new URLSearchParams(location.search)).get('local') || 'direto';
  var chave = 'bc_lead_grupo_vip';
  var jaContou = false;
  // so evita contar de novo em recarga/voltar logo em seguida (30s), sem travar novos testes
  try { var ult = +sessionStorage.getItem(chave) || 0; jaContou = Date.now() - ult < 30000; sessionStorage.setItem(chave, String(Date.now())); } catch (e) {}
  if (!jaContou) {
    // Pixel na categoria saude: o Meta restringe eventos padrao (Lead/Contact).
    // O evento de conversao e o personalizado EntrouGrupoVIP (confirmado no Gerenciador de Eventos).
    if (window.fbq) {
      fbq('trackCustom', 'EntrouGrupoVIP');
      fbq('track', 'Contact', { content_name: 'Grupo VIP Black', local: local });
      fbq('track', 'Lead', { content_name: 'Grupo VIP Black', local: local });
    }
    if (window.gtag) gtag('event', 'generate_lead', { lead_source: 'Grupo VIP Black', local: local, transport_type: 'beacon' });
    (window.dataLayer = window.dataLayer || []).push({ event: 'grupo_vip_lead', local: local });
  }
  // So abre o WhatsApp depois que o EntrouGrupoVIP saiu de fato (o Pixel demora para carregar).
  // Limite de 2,5s; se o Pixel nao carregar, manda o evento direto pela URL do Pixel.
  var inicio = Date.now(), foi = false;
  function saiu(re){
    try { return performance.getEntriesByType('resource').some(function(e){ return re.test(e.name); }); }
    catch (e) { return false; }
  }
  // ?teste=1 nao abre o grupo: mostra na tela se o Lead saiu (para conferir no celular)
  var TESTE = /[?&]teste=1/.test(location.search);
  function abrir(){
    if (foi) return; foi = true;
    if (!TESTE) return location.replace(GRUPO);
    var pl = saiu(/facebook\.com\/tr\/?\?.*ev=EntrouGrupoVIP/), g = saiu(/g\/collect/);
    document.querySelector('main p').innerHTML = 'TESTE (não abre o grupo)<br>Pixel EntrouGrupoVIP: ' + (pl ? 'enviado ✅' : 'não enviado ❌')
      + '<br>GA4: ' + (g ? 'enviado ✅' : 'não enviado ❌') + '<br>Tempo: ' + (Date.now() - inicio) + ' ms';
    document.querySelector('.spin').style.display = 'none';
  }
  function reserva(){
    var c = document.cookie.match(/_fbp=([^;]+)/), f = document.cookie.match(/_fbc=([^;]+)/);
    var u = 'https://www.facebook.com/tr?id=1111388071726457&ev=EntrouGrupoVIP&noscript=1&cd[local]=' + encodeURIComponent(local)
      + (c ? '&fbp=' + c[1] : '') + (f ? '&fbc=' + f[1] : '') + '&dl=' + encodeURIComponent(location.href);
    new Image().src = u;
  }
  var reservaUsada = false;
  (function checar(){
    var t = Date.now() - inicio;
    var lead = jaContou || saiu(/facebook\.com\/tr\/?\?.*ev=EntrouGrupoVIP/);
    var ga = jaContou || saiu(/g\/collect.*en=generate_lead/) || t > 1500;
    if (lead && ga && t > 400) return setTimeout(abrir, 150);
    if (t > 2000 && !lead && !reservaUsada) { reservaUsada = true; reserva(); return setTimeout(abrir, 400); }
    if (t > 2500) return abrir();
    setTimeout(checar, 100);
  })();
})();
</script>
